name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Always publish a clean static tree to the gh-pages branch (works once
  # Settings → Pages → Deploy from branch → gh-pages is selected).
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static bundle
        run: |
          mkdir -p _site
          cp -r index.html package.json README.md css js .nojekyll _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy Clockwork static site"

  # Also try Actions-based Pages (succeeds after Pages source is set to GitHub Actions).
  deploy-actions:
    runs-on: ubuntu-latest
    needs: publish-branch
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static bundle
        run: |
          mkdir -p _site
          cp -r index.html package.json README.md css js .nojekyll _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
