<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="540"></canvas>
<script type="module">
import { loadArt } from '../js/art/refart.js';
import { drawCg } from '../js/art/cgs.js';
await loadArt('../assets/art/');
const id = new URLSearchParams(location.search).get('id') || 'watch';
const ctx = document.getElementById('c').getContext('2d');
drawCg(ctx, id, 1500, { shortHair: id !== 'haircut' && id !== 'sisters' && id !== 'stag' && id !== 'watch', eyepatch: id === 'ox' });
</script></body></html>
